<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Charith Neranga - LS Publication Dept.">
  <meta name="copyright" content="© 2026 LS Publication Dept. Unique ID: LSPUB-778899-CN">
  <title>VIP RAFFLE-ELIGIBLE RACES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.autotable.min.js"></script>
  <style>
    /* === STYLES FROM VVIP.CSS (KEEPING EVERYTHING SAME) === */
    :root {
      --neon-green: #39FF14;
      --neon-yellow: #FFFF33;
      --neon-red: #FF3131;
      --soft-yellow: #f9fbe7;
      --soft-green: #e8f5e9;
      --table-blue: #0070c0;
    }

    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--soft-yellow); min-height: 100vh; }
    #bg1 { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%); z-index: -1; }
    .overlay { padding: 40px 20px; display: flex; justify-content: center; }

    .password-screen, .container-main {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .password-screen { max-width: 450px; text-align: center; margin-top: 50px; }
    .neon-text-green { color: #2e7d32; text-shadow: 0 0 10px var(--neon-green); font-weight: 800; }
    .neon-text-yellow { color: #f9a825; text-shadow: 0 0 10px var(--neon-yellow); font-weight: 800; }
    .neon-input { border: 2px solid #c5e1a5; border-radius: 12px; }

    .btn { border-radius: 12px; font-weight: bold; text-transform: uppercase; transition: all 0.3s; border: none; padding: 10px 20px; }
    .btn:hover { transform: translateY(-4px) scale(1.05); }
    .btn-neon-green { background: #43a047; color: white; }
    .btn-neon-red { background: #e53935; color: white; }
    .btn-neon-yellow { background: #fbc02d; color: white; }
    .btn-neon-blue { background: #1e88e5; color: white; }
    .btn-neon-info { background: #00acc1; color: white; }
    .btn-neon-print { background: #546e7a; color: white; }

    .race-block { background: white; border-left: 10px solid #43a047; padding: 20px; margin-bottom: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

    .vip-table { width: 100%; background: white; border-collapse: collapse; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 20px; }
    .vip-table th { background-color: #2e7d32; color: white; padding: 15px; }
    .vip-table td { padding: 12px 15px; border-bottom: 1px solid #e8f5e9; text-align: center; }

    /* === HIGHLIGHT TABLE STYLE === */
    .highlight-table { width: 100%; border: 3px solid #7030a0; border-collapse: collapse; background: white; margin-top: 20px; table-layout: fixed; }
    .highlight-table th { background-color: #fff2cc; color: var(--table-blue); text-align: center; padding: 10px 5px; border: 2px dotted var(--table-blue); font-weight: bold; font-size: 0.9rem; }
    .highlight-table td { border: 2px dotted var(--table-blue); padding: 10px; text-align: center; vertical-align: middle; font-weight: 500; word-wrap: break-word; }
    .time-cell { font-weight: bold; line-height: 1.2; display: block; }
    .ampm { font-size: 0.8rem; display: block; margin-top: 2px; }
    .prize-highlight { color: var(--table-blue); font-weight: bold; }

    .flag-icon { width: 80px; margin-bottom: 15px; }

    /* === FIXED PRINT CSS === */
    @media print {
      @page { size: auto; margin: 15mm; }
      body { background: white !important; -webkit-print-color-adjust: exact; }
      #bg1, .btn, #raceText, .row, .d-flex, footer, .password-screen, #meetingsInput, .mb-3, .mb-4 { display: none !important; }
      .container-main { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
      .overlay { padding: 0 !important; display: block !important; }
      #output, .print-area { visibility: visible !important; width: 100% !important; position: static !important; overflow: visible !important; }
      .highlight-table { border: 2px solid #7030a0 !important; width: 100% !important; page-break-inside: auto; }
      .highlight-table tr { page-break-inside: avoid; page-break-after: auto; }
      .highlight-table td, .highlight-table th { font-size: 9pt !important; border: 1px dotted var(--table-blue) !important; padding: 8px !important; }
    }
  </style>
</head>
<body>
  <div id="bg1"></div>

  <div class="overlay"> 
    <div id="passwordScreen" class="password-screen">
      <img src="https://lottiefolder.com/wp-content/uploads/2022/11/lottie-flag-animation-uk-1.gif" class="flag-icon" />
      <h2 class="neon-text-green mb-3">UK RAFFLE ACCESS</h2>
      <img src="https://i.gifer.com/7qQf.gif" width="220" class="mb-3" style="border-radius: 50%; border: 2px solid #39FF14;" />
      <input type="password" id="password" class="form-control mb-3 neon-input" placeholder="Enter VIP Password..." onkeypress="handleKeyPress(event)" />
      <button class="btn btn-neon-green w-100" onclick="checkPassword()">Unlock Premium Access</button>
    </div>

    <div class="container container-main" id="mainContent" style="display: none;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="neon-text-yellow">VIP DASHBOARD</h2>
        <button class="btn btn-neon-red btn-sm" onclick="logout()">Logout</button>
      </div>
      
      <textarea id="raceText" rows="10" class="form-control mb-3 neon-input" placeholder="Paste race card text here..."></textarea>

      <div class="row mb-3">
        <div class="col-md-12">
            <input type="text" id="meetingsInput" class="form-control mb-3 neon-input" placeholder="Enter meeting names (comma separated)" />
        </div>
        <div class="col-md-6">
          <input type="number" id="minPrize" class="form-control mb-3 neon-input" placeholder="Min Prize (£)" />
        </div>
        <div class="col-md-6">
          <input type="number" id="maxPrize" class="form-control mb-3 neon-input" placeholder="Max Prize (£)" />
        </div>
      </div>

      <div class="d-flex gap-2 mb-4 flex-wrap justify-content-center">
        <button class="btn btn-neon-blue" onclick="processText('highlight')">Today's Highlights</button>
        <button class="btn btn-neon-green" onclick="processText('table')">Process to Table</button>
        <button class="btn btn-neon-green" onclick="processText('block')">Process (Blocks)</button>
        <button class="btn btn-neon-red" onclick="clearAll()">Clear All</button>
        <button class="btn btn-neon-yellow" onclick="showTopRaces(5)">Top 5</button>
        <button class="btn btn-neon-yellow" onclick="showTopRaces(10)">Top 10</button>
        <button class="btn btn-neon-yellow" onclick="showTopRaces(20)">Top 20</button>
        <button class="btn btn-neon-blue" onclick="showBestRacePerMeeting()">Best Race/Meeting</button>
        <button class="btn btn-neon-info" onclick="downloadPDF()">Download PDF</button>
        <button class="btn btn-neon-info" onclick="downloadTXT()">Download TXT</button>
        <button class="btn btn-neon-info" onclick="downloadStablesTXT()">STABLES TXT</button>
        <button class="btn btn-neon-print" onclick="window.print()">Print Output</button>
      </div>

      <div id="output" class="print-area"></div>

      <footer class="mt-5 text-center py-3" style="color: #2e7d32; font-weight: bold; border-top: 1px solid rgba(0,0,0,0.1);">
        © 2026 | LS Publication Dept. | Developed by Charith Neranga
      </footer>
    </div>
  </div>

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode === 123) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode === 73) return false;
      if (e.ctrlKey && e.shiftKey && e.keyCode === 74) return false;
      if (e.ctrlKey && e.keyCode === 85) return false;
    };

    function checkPassword() {
      const entered = document.getElementById("password").value;
      if (entered === "lal1234") {
        document.getElementById("passwordScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      } else { alert("Incorrect VIP Password!"); }
    }

    function handleKeyPress(e) { if (e.key === "Enter") { checkPassword(); } }
    function logout() { window.location.href = "https://agcneranga.github.io/LS-Publication/"; }

    let processedRaces = [];
    let currentDisplayMode = 'block';

    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function clearAll() {
      document.getElementById('raceText').value = '';
      document.getElementById('meetingsInput').value = '';
      document.getElementById('minPrize').value = '';
      document.getElementById('maxPrize').value = '';
      document.getElementById('output').innerHTML = '';
      processedRaces = [];
    }

    function processText(mode = 'block') {
      currentDisplayMode = mode;
      const text = document.getElementById('raceText').value;
      const minPrize = parseInt(document.getElementById('minPrize').value || 0);
      const maxPrize = parseInt(document.getElementById('maxPrize').value || 99999999);
      const meetingsRaw = document.getElementById('meetingsInput').value;
      const filter = meetingsRaw ? meetingsRaw.split(',').map(m => m.trim().toUpperCase()).filter(m => m.length > 0) : [];

      if (!text.trim()) { alert('Please paste race card text first.'); return; }

      const lines = text.split(/\r?\n/);
      let currentMeeting = 'Unknown';
      let races = [];
      const explicitRaceLineRegex = /^([\w]+(?:\s*\/\s*\d+)?)[\s]+(\d{1,2}[—:]\d{2})/;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (/^[A-Z\s\-']{1,30}$/.test(line) && !line.match(/\d/) && !line.includes('£')) {
          currentMeeting = line;
          continue;
        }

        let explicitMatch = line.match(explicitRaceLineRegex);
        if (explicitMatch) {
          const raceNumber = explicitMatch[1].trim();
          const ukTime = explicitMatch[2].replace('—', ':');
          let slTime = 'N/A', prize = 0, raceNameLines = [];

          for (let j = i + 1; j < Math.min(i + 12, lines.length); j++) {
            const l = lines[j].trim();
            if (slTime === 'N/A' && /^\(?\d{1,2}[:.—]\d{2}\)?$/.test(l)) { 
                slTime = l.replace(/[()]/g, '').replace(/[.—]/g, ':'); 
                continue; 
            }
            if (l.includes('£')) {
              const pMatch = l.match(/£([\d,]+)/);
              if (pMatch) prize = parseInt(pMatch[1].replace(/,/g, ''));
              break;
            }
            if (l.length > 2 && !/^\(?\d{1,2}[.:—]\d{2}\)?$/.test(l)) { raceNameLines.push(l); }
          }
          
          if (filter.length && !filter.includes(currentMeeting.toUpperCase())) continue;
          if (prize >= minPrize && prize <= maxPrize) {
            races.push({meeting: currentMeeting, raceNumber, ukTime, rawSLTime: slTime, raceName: raceNameLines.join(' '), prize});
          }
        }
      }

      races.sort((a, b) => {
        const timeToMinutes = t => {
          if (t === 'N/A') return 9999;
          const parts = t.split(':').map(Number);
          return (parts[0] || 0) * 60 + (parts[1] || 0);
        };
        return timeToMinutes(a.rawSLTime) - timeToMinutes(b.rawSLTime);
      });

      processedRaces = races;
      renderRaces(races, mode);
    }

    function renderRaces(races, mode = currentDisplayMode) {
      const output = document.getElementById('output');
      if (mode === 'highlight') {
        let html = `<table class="highlight-table"><thead><tr><th style="width:12%">UK TIME</th><th style="width:12%">SL TIME</th><th style="width:20%">RACE COURSE</th><th>RACE NAME</th><th style="width:18%">PRIZE MONEY</th></tr></thead><tbody>`;
        races.forEach(r => {
          const ukT = formatTime(r.ukTime);
          const slT = formatTime(r.rawSLTime);
          html += `<tr>
            <td><span class="time-cell">${ukT.time}</span><span class="ampm">${ukT.ampm}</span></td>
            <td><span class="time-cell">${slT.time}</span><span class="ampm">${slT.ampm}</span></td>
            <td>${r.meeting}</td>
            <td style="text-align:left;">${escapeHtml(r.raceName)}</td>
            <td class="prize-highlight">£${r.prize.toLocaleString()}.00</td>
          </tr>`;
        });
        output.innerHTML = html + "</tbody></table>";
      } else if (mode === 'table') {
        let html = `<table class="vip-table"><thead><tr><th>Meeting</th><th>No.</th><th>UK Time</th><th>SL Time</th><th>Race Name</th><th>Prize (£)</th></tr></thead><tbody>`;
        races.forEach(r => {
          const ukT = formatTime(r.ukTime);
          const slT = formatTime(r.rawSLTime);
          html += `<tr><td>${r.meeting}</td><td>${r.raceNumber}</td><td>${ukT.time} ${ukT.ampm}</td><td>${slT.time} ${slT.ampm}</td><td>${escapeHtml(r.raceName)}</td><td>${r.prize.toLocaleString()}</td></tr>`;
        });
        output.innerHTML = html + "</tbody></table>";
      } else {
        output.innerHTML = races.map(r => {
          const ukT = formatTime(r.ukTime);
          const slT = formatTime(r.rawSLTime);
          return `
          <div class="race-block">
            <div><strong>Race Course:</strong> ${r.meeting}</div>
            <div><strong>Race Number:</strong> ${r.raceNumber}</div>
            <div><strong>UK Time:</strong> ${ukT.time} ${ukT.ampm} | <strong>SL Time:</strong> ${slT.time} ${slT.ampm}</div>
            <div><strong>Race Name:</strong> ${escapeHtml(r.raceName)}</div>
            <div><strong>Prize Money:</strong> £${r.prize.toLocaleString()}</div>
          </div>`;
        }).join('');
      }
    }

    function formatTime(t) {
      if (t === 'N/A' || !t) return { time: 'N/A', ampm: '' };
      const cleanT = t.replace(/[—.]/g, ':');
      const parts = cleanT.split(':');
      let hr = parseInt(parts[0]);
      const ampm = (hr >= 12 || hr < 9) ? "PM" : "AM";
      return { time: cleanT, ampm: ampm };
    }

    function showTopRaces(limit) {
      if (!processedRaces.length) { alert("Please process races first."); return; }
      const topRaces = [...processedRaces].sort((a, b) => b.prize - a.prize).slice(0, limit);
      renderRaces(topRaces);
    }

    function showBestRacePerMeeting() {
      if (!processedRaces.length) { alert("Please process races first."); return; }
      const bestRaces = {};
      processedRaces.forEach(r => { if (!bestRaces[r.meeting] || r.prize > bestRaces[r.meeting].prize) { bestRaces[r.meeting] = r; } });
      renderRaces(Object.values(bestRaces).sort((a, b) => b.prize - a.prize));
    }

    function downloadPDF() {
      if (!processedRaces.length) { alert("No data to download."); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      doc.setFontSize(14);
      doc.setTextColor(46, 125, 50);
      doc.text("UK RAFFLE-ELIGIBLE RACES REPORT", 105, 15, { align: 'center' });
      
      const tableData = processedRaces.map(r => {
        const ukT = formatTime(r.ukTime);
        const slT = formatTime(r.rawSLTime);
        return [
          `${ukT.time} ${ukT.ampm}`,
          `${slT.time} ${slT.ampm}`,
          r.meeting,
          r.raceName,
          `£${r.prize.toLocaleString()}.00`
        ];
      });

      doc.autoTable({
        head: [['UK TIME', 'SL TIME', 'RACE COURSE', 'RACE NAME', 'PRIZE MONEY']],
        body: tableData,
        startY: 25,
        theme: 'grid',
        styles: { fontSize: 8, cellPadding: 3, valign: 'middle', halign: 'center', overflow: 'linebreak' },
        headStyles: { fillColor: [46, 125, 50], textColor: [255, 255, 255], fontStyle: 'bold' },
        columnStyles: { 3: { cellWidth: 70, halign: 'left' }, 4: { textColor: [0, 112, 192], fontStyle: 'bold' } }
      });
      
      doc.save("VIP_Race_Report.pdf");
    }

    function downloadTXT() {
      if (!processedRaces.length) { alert("No data available."); return; }
      
      const col1 = 15, col2 = 15, col3 = 25, col4 = 65, col5 = 20;
      
      let txt = "UK TIME".padEnd(col1) + "SL TIME".padEnd(col2) + "RACE COURSE".padEnd(col3) + "RACE NAME".padEnd(col4) + "PRIZE MONEY\n";
      txt += "=".repeat(col1 + col2 + col3 + col4 + col5) + "\n";

      processedRaces.forEach(r => { 
        const ukT = formatTime(r.ukTime);
        const slT = formatTime(r.rawSLTime);
        
        const fUK = (`${ukT.time} ${ukT.ampm}`).padEnd(col1);
        const fSL = (`${slT.time} ${slT.ampm}`).padEnd(col2);
        const fCourse = r.meeting.padEnd(col3);
        const fName = r.raceName.padEnd(col4);
        const fPrize = `£${r.prize.toLocaleString()}.00`;
        
        txt += `${fUK}${fSL}${fCourse}${fName}${fPrize}\n`; 
      });

      const blob = new Blob([txt], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); 
      a.download = "Races_Report.txt"; 
      a.click();
    }

    function downloadStablesTXT() {
      if (!processedRaces.length) { alert("No data available."); return; }
      let txt = "";
      processedRaces.forEach((r) => { 
        const ukT = formatTime(r.ukTime);
        const slT = formatTime(r.rawSLTime);
        txt += `UK TIME: ${ukT.time} ${ukT.ampm}\nSL TIME: ${slT.time} ${slT.ampm}\nRACE COURSE: ${r.meeting}\nRACE NAME: ${r.raceName}\nPrize MONEY: £${r.prize.toLocaleString()}\n\n`; 
      });
      const blob = new Blob([txt], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = "Stables_Output.txt"; a.click();
    }
  </script>
</body>
</html>
